name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, json, libxml, mbstring, zlib
          coverage: pcov

      - name: Instalar dependências
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Validar composer.json
        run: composer validate --strict

      - name: Estilo (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Análise estática (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Testes e cobertura (Pest)
        run: vendor/bin/pest --coverage --min=90

  laravel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '10'
            guzzle: '7'
          - laravel: '13'
            testbench: '11'
            guzzle: '7'
          - laravel: '13'
            testbench: '11'
            guzzle: '8'
    name: Laravel ${{ matrix.laravel }} + Guzzle ${{ matrix.guzzle }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, json, libxml, mbstring, zlib
          coverage: none

      - name: Instalar dependências
        run: composer update --no-interaction --no-progress --prefer-dist --with "illuminate/support:^${{ matrix.laravel }}.0" --with "orchestra/testbench:^${{ matrix.testbench }}.0" --with "guzzlehttp/guzzle:^${{ matrix.guzzle }}.0"

      - name: Testes (Pest)
        run: vendor/bin/pest
